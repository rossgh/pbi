{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="card center">
  <h1>{{ code }}</h1>
  <p class="muted">{{ 'You don’t have access to that page.' if code == 403 else 'We couldn’t find that page.' }}</p>
  <a class="btn" href="{{ url_for('main.index') }}">Go home</a>
</div>
{% endblock %}
